[package]
name = "ontaria-wasm"
version = "0.6.0"
edition = "2024"
rust-version = "1.88"
description = "WebAssembly bindings for Ontaria"
license = "MIT"
repository = "https://github.com/vbasky/ontaria"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
ontaria = { path = "..", default-features = false }
serde_json = "1.0.154"
wasm-bindgen = "0.2"
