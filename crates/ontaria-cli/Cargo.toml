[package]
name = "ontaria-cli"
version = "0.9.2"
edition.workspace = true
rust-version = "1.89"
license.workspace = true
repository.workspace = true
description = "Look up, validate, diff, and generate from an RDF Schema or OWL ontology"
keywords = ["rdf", "owl", "ontology", "json-ld", "cli"]
categories = ["command-line-utilities", "parser-implementations"]
readme = "README.md"

[[bin]]
name = "ontaria"
path = "src/main.rs"

[features]
default = []
## Story Object Model 1.0 commands. The `som` crate is vendored in this
## repository and is not on crates.io, so a crates.io install leaves it off.
som = ["dep:som"]
mcp = ["dep:rmcp", "dep:tokio", "dep:schemars"]
shacl = ["ontaria/shacl"]
reasoning = ["ontaria/reasoning"]

[dependencies]
clap = { version = "4", features = ["derive"] }
glob = "0.3"
ontaria = { path = "../ontaria", version = "0.9.2" }
som = { path = "../../third_party/som/implementations/rust", optional = true }
rmcp = { version = "3.9", optional = true, features = ["server", "macros", "transport-io"] }
schemars = { version = "1", optional = true }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tiny_http = "0.12"
tokio = { version = "1", optional = true, features = ["rt-multi-thread", "macros", "io-std"] }

# The crates.io package drops the som feature because that crate is not
# published. The cfg attributes stay in the source.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("som"))'] }
