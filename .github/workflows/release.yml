name: Release

run-name: Release ${{ github.event.inputs.tag || github.ref_name }}

on:
  push:
    tags: [v*]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to build, for example v0.1.0
        required: true
        type: string

permissions:
  contents: write
  actions: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
            ext: tar.gz
          - target: x86_64-apple-darwin
            os: macos-latest
            ext: tar.gz
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            ext: tar.gz
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            ext: zip

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}

      - name: Check the tag matches the crate
        run: |
          case "$RELEASE_TAG" in
            v*) ;;
            *) echo "::error::expected a v* tag, got '${RELEASE_TAG}'"; exit 1 ;;
          esac
          expected="${RELEASE_TAG#v}"
          got=$(awk -F'"' '/^version = / { print $2; exit }' crates/ontaria/Cargo.toml)
          if [ "$got" != "$expected" ]; then
            echo "::error::checked out ontaria ${got}, tag is ${RELEASE_TAG}"
            exit 1
          fi

      - name: Install Rust
        run: |
          rustup update stable --no-self-update
          rustup target add ${{ matrix.target }}

      - name: Build
        run: cargo build --release -p ontaria-cli --features som --target ${{ matrix.target }}

      - name: Archive (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          cd target/${{ matrix.target }}/release
          archive="ontaria-${{ env.RELEASE_TAG }}-${{ matrix.target }}.tar.gz"
          tar czf "${archive}" ontaria
          echo "archive=${archive}" >> "$GITHUB_ENV"

      - name: Archive (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          cd target/${{ matrix.target }}/release
          archive="ontaria-${{ env.RELEASE_TAG }}-${{ matrix.target }}.zip"
          7z a "${archive}" ontaria.exe
          echo "archive=${archive}" >> "$GITHUB_ENV"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: target/${{ matrix.target }}/release/${{ env.archive }}

  release:
    name: Create GitHub Release
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}

      - name: Download all binaries
        uses: actions/download-artifact@v4
        with:
          pattern: "*"
          merge-multiple: true
          path: /tmp/assets

      - name: Checksums
        working-directory: /tmp/assets
        run: |
          for f in *; do
            [[ "$f" != *.sha256 ]] && shasum -a 256 "$f" > "$f.sha256"
          done

      - name: Generate release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${RELEASE_TAG}"
          # Rebuilding an existing release keeps its title and notes.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] \
            && gh release view "$VERSION" --json body,name > /tmp/existing-release.json; then
            jq -r .body /tmp/existing-release.json > /tmp/release-notes.md
            echo "RELEASE_NAME=$(jq -r .name /tmp/existing-release.json)" >> "$GITHUB_ENV"
          else
            echo "RELEASE_NAME=ontaria ${VERSION}" >> "$GITHUB_ENV"
            : > /tmp/release-notes.md
          fi
          if [ ! -s /tmp/release-notes.md ]; then
            awk -v ver="${VERSION#v}" '
              $0 == "## " ver { found=1; next }
              found && /^## / { exit }
              found && !started && $0 == "" { next }
              found { started=1; print }
            ' CHANGELOG.md > /tmp/release-notes.md
          fi
          if [ ! -s /tmp/release-notes.md ]; then
            echo "::error::CHANGELOG.md has no section for ${VERSION#v}"
            exit 1
          fi

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_NAME }}
          body_path: /tmp/release-notes.md
          files: /tmp/assets/*
          fail_on_unmatched_files: true

  publish:
    name: Publish to crates.io
    # A manual rebuild publishes too. Versions already on crates.io are skipped.
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 15
    needs: [release]
    runs-on: ubuntu-latest
    steps:
      - name: Bail if prior workflow run started < 10 min ago
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          prev=$(gh api "repos/${{ github.repository }}/actions/workflows/release.yml/runs?per_page=5" \
            --jq "[.workflow_runs[] | select(.id != ${{ github.run_id }} and .event == \"push\")][0].run_started_at")
          if [ -z "$prev" ] || [ "$prev" = "null" ]; then
            echo "No prior run found; proceeding."
            exit 0
          fi
          diff=$(( $(date +%s) - $(date -d "$prev" +%s) ))
          echo "Previous run started ${diff}s ago at ${prev}."
          if [ "$diff" -lt 600 ]; then
            echo "::error::Previous run started less than 10 minutes ago — bailing to avoid duplicate publish."
            exit 1
          fi

      - uses: actions/checkout@v4

      - name: Install Rust
        run: |
          rustup update stable --no-self-update
          rustup default stable

      - name: Publish crates (dependency order, skip versions already on crates.io)
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          # ontaria-macros must be on crates.io before ontaria, and ontaria before the CLI.
          # The vendored som crate is not published. Drop that optional path
          # dependency so the crates.io package can be installed without it.
          python3 - <<'PY'
          from pathlib import Path
          path = Path("crates/ontaria-cli/Cargo.toml")
          kept = []
          for line in path.read_text().splitlines(keepends=True):
              if line.startswith("som = ") or "Story Object Model 1.0 commands" in line or line.startswith("## repository and is not on crates.io"):
                  continue
              kept.append(line)
          path.write_text("".join(kept))
          PY
          CRATES=(
            ontaria-macros
            ontaria
            ontaria-cli
          )
          metadata=$(cargo metadata --format-version 1 --no-deps)
          macros_version=$(jq -r '.packages[] | select(.name == "ontaria-macros") | .version' <<<"$metadata")
          macros_req=$(jq -r '.packages[] | select(.name == "ontaria") | .dependencies[] | select(.name == "ontaria-macros") | .req' <<<"$metadata")
          if [ "$macros_req" != "^${macros_version}" ]; then
            echo "::error::ontaria depends on ontaria-macros ${macros_req}, but the macros crate is ${macros_version}. Keep path and version in sync."
            exit 1
          fi
          for c in "${CRATES[@]}"; do
            version=$(jq -r --arg c "$c" '.packages[] | select(.name == $c) | .version' <<<"$metadata")
            if [ -z "$version" ]; then
              echo "::error::No version found for ${c} in workspace metadata"
              exit 1
            fi
            http=$(curl -sSL -o /dev/null -w "%{http_code}" \
              -H "User-Agent: ontaria-release (https://github.com/${{ github.repository }})" \
              "https://crates.io/api/v1/crates/${c}/${version}")
            if [ "$http" = "200" ]; then
              echo "==> SKIP ${c}@${version}: already on crates.io"
              continue
            fi
            echo "==> cargo publish ${c}@${version}"
            # The som strip above edits Cargo.toml in the runner checkout.
            cargo publish -p "${c}" --allow-dirty
          done
