[package]
name = "ontaria-python"
version = "0.6.0"
edition = "2024"
rust-version = "1.88"
description = "Python bindings for Ontaria"
license = "MIT"
repository = "https://github.com/vbasky/ontaria"

[lib]
name = "ontaria_python"
crate-type = ["cdylib", "rlib"]

[dependencies]
ontaria = { path = "..", default-features = false }
pyo3 = "0.26"
serde_json = "1.0.154"
