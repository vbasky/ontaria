    <g opacity="0.8">
      <rect x="1080" y="34" width="32" height="9" rx="4.5" fill="#4338ca"/>
      <rect x="1120" y="34" width="32" height="9" rx="4.5" fill="#4338ca"/>
      <rect x="1160" y="34" width="32" height="9" rx="4.5" fill="#c2410c"/>
      <rect x="1200" y="34" width="32" height="9" rx="4.5" fill="#c2410c"/>
      <rect x="24" y="410" width="32" height="9" rx="4.5" fill="#4338ca"/>
      <rect x="64" y="410" width="32" height="9" rx="4.5" fill="#c2410c"/>
    </g>
  </g>

  <g filter="url(#cardShadow)">
    <rect x="96" y="72" width="316" height="316" rx="36" fill="#fffcf8" stroke="#e7e0d6" stroke-width="1.5"/>
    <rect x="136" y="116" width="204" height="32" rx="16" fill="#1c1917"/>
    <path d="M340 132 V268" stroke="#1c1917" stroke-width="7" stroke-linecap="round"/>
    <circle cx="340" cy="300" r="30" fill="#4338ca"/>
    <circle cx="340" cy="300" r="18" fill="none" stroke="#fffcf8" stroke-width="2.5"/>
    <rect x="136" y="166" width="124" height="18" rx="9" fill="#4338ca"/>
    <rect x="136" y="214" width="160" height="11" rx="5.5" fill="#d6d3d1"/>
