[package]
name = "ontaria"
version = "0.8.0"
edition = "2024"
rust-version = "1.88"
description = "Parse RDF Schema and OWL ontologies and query, validate, diff, and generate from them"
license = "MIT"
repository = "https://github.com/vbasky/ontaria"
readme = "README.md"
keywords = ["rdf", "owl", "json-ld", "ontology", "shacl"]
categories = ["parser-implementations"]

[workspace]
members = [".", "ontaria-cli", "ontaria-macros", "ontaria-wasm", "ontaria-python"]
resolver = "2"

[features]
default = ["fetch"]
## Download ontologies with ureq. Turn this off for offline and embedded use.
fetch = ["dep:ureq"]
## Async downloads with reqwest. The caller supplies the async runtime.
async-fetch = ["dep:reqwest"]
## Re-export the `terms!` proc macro from `ontaria-macros`.
codegen = ["dep:ontaria-macros"]
## SHACL validation through the `shacl-rust` crate (MIT).
shacl = ["dep:shacl-rust", "dep:oxigraph"]
## OWL 2 RL materialization through `reasonable` (BSD-3-Clause).
reasoning = ["dep:reasonable"]

[dependencies]
ontaria-macros = { path = "ontaria-macros", optional = true }
oxigraph = { version = "0.5", optional = true, default-features = false }
oxjsonld = "0.2.7"
oxrdf = "0.3.5"
oxrdfxml = "0.2.5"
oxttl = "0.2.5"
reasonable = { version = "0.4.4", optional = true }
reqwest = { version = "0.12", optional = true, default-features = false, features = ["rustls-tls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_yaml = "0.9"
shacl-rust = { version = "0.2.12", optional = true }
sha2 = "0.11.1"
thiserror = "2.0.21"
toml = "0.9"
ureq = { version = "3.5.1", optional = true }

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "load"
harness = false

[package.metadata.docs.rs]
features = ["fetch"]
