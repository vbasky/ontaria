  <g font-family="Helvetica, Arial, sans-serif">
    <text x="500" y="248" font-size="96" font-weight="700" fill="#1c1917" letter-spacing="-2">vocable</text>
    <rect x="500" y="266" width="188" height="7" rx="3.5" fill="#4338ca"/>
    <text x="500" y="328" font-size="26" font-weight="500" fill="#44403c">Look up any term in an ontology.</text>
    <text x="500" y="376" font-size="20" font-weight="600" fill="#57534e" letter-spacing="2.4">TURTLE &#183; OWL &#183; RDFS &#183; SCHEMA.ORG</text>
    <text x="500" y="416" font-size="17" font-weight="500" fill="#78716c">a word, as a vocabulary enters it</text>
