    </filter>
    <clipPath id="frame"><rect x="0" y="0" width="1300" height="460" rx="18"/></clipPath>
  </defs>

  <rect width="1300" height="460" rx="18" fill="url(#bg)" stroke="#e4dcd2" stroke-width="2"/>

  <g clip-path="url(#frame)">
