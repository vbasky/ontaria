[package]
name = "ontaria-cli"
version = "0.9.1"
edition.workspace = true
rust-version = "1.89"
license.workspace = true
repository.workspace = true
description = "Look up, validate, diff, and generate from an RDF Schema or OWL ontology"
keywords = ["rdf", "owl", "ontology", "json-ld", "cli"]
categories = ["command-line-utilities", "parser-implementations"]
readme = "README.md"
publish = false

[[bin]]
name = "ontaria"
path = "src/main.rs"

[features]
default = []
mcp = ["dep:rmcp", "dep:tokio", "dep:schemars"]
shacl = ["ontaria/shacl"]
reasoning = ["ontaria/reasoning"]

[dependencies]
clap = { version = "4", features = ["derive"] }
glob = "0.3"
ontaria = { path = "../ontaria", version = "0.9.1" }
rmcp = { version = "3.9", optional = true, features = ["server", "macros", "transport-io"] }
schemars = { version = "1", optional = true }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
som = { path = "../../third_party/som/implementations/rust" }
tiny_http = "0.12"
tokio = { version = "1", optional = true, features = ["rt-multi-thread", "macros", "io-std"] }
