[workspace]
resolver = "2"
members = [
    "crates/ontaria",
    "crates/ontaria-cli",
    "crates/ontaria-macros",
    "crates/ontaria-wasm",
    "crates/ontaria-python",
    "third_party/som/implementations/rust",
]

[workspace.package]
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/vbasky/ontaria"
