[package]
name = "ontaria-cli"
version = "0.6.0"
edition = "2024"
rust-version = "1.88"
description = "Command-line tool for looking up ontology terms"
license = "MIT"
repository = "https://github.com/vbasky/ontaria"
publish = false

[[bin]]
name = "ontaria"
path = "src/main.rs"

[features]
default = []
mcp = ["dep:rmcp", "dep:tokio", "dep:schemars"]
shacl = ["ontaria/shacl"]

[dependencies]
clap = { version = "4.6.1", features = ["derive"] }
ontaria = { path = ".." }
rmcp = { version = "3.9", optional = true, features = ["server", "macros", "transport-io"] }
schemars = { version = "1", optional = true }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tiny_http = "0.12"
tokio = { version = "1", optional = true, features = ["rt-multi-thread", "macros", "io-std"] }
