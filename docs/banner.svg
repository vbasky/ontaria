<svg width="1300" height="460" viewBox="0 0 1300 460" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="vocable — look up any term in an ontology">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1300" y2="460" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fbf8f4"/>
      <stop offset="1" stop-color="#f1ebe3"/>
    </linearGradient>
    <radialGradient id="warm" cx="18%" cy="42%" r="46%">
      <stop offset="0" stop-color="#fde7c7" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#fde7c7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ink" cx="78%" cy="48%" r="50%">
      <stop offset="0" stop-color="#e0e7ff" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#e0e7ff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
