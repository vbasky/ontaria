[package]
name = "ontaria-python"
version = "0.9.2"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Python bindings for Ontaria"

[lib]
name = "ontaria_python"
crate-type = ["cdylib", "rlib"]

[dependencies]
ontaria = { path = "../ontaria", default-features = false }
pyo3 = "0.26"
serde_json = "1.0.154"
