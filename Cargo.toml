[package]
name = "vocable"
version = "0.1.0"
edition = "2024"
description = "Query RDF Schema and OWL ontologies from the command line"
license = "MIT"

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock", "now", "std"] }
clap = { version = "4.6.7", features = ["derive"] }
oxrdf = "0.3.5"
oxttl = "0.2.5"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
thiserror = "2.0.21"
ureq = "3.5.1"
